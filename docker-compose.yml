services:
  postgres:
    image: postgres:17-alpine
    container_name: learnlens_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnlens123}
      POSTGRES_DB: ${POSTGRES_DB:-learnlens_automated_grading}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/learnlens_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-learnlens_automated_grading}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnlens_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-learnlens123}@postgres:5432/${POSTGRES_DB:-learnlens_automated_grading}
      SECRET_KEY: ${SECRET_KEY:-learnlens-super-secret-production-key-change-me}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      UPLOAD_DIR: uploads
      # Empty on Linux so pytesseract uses /usr/bin/tesseract from PATH
      TESSERACT_CMD: ""
      CORS_ORIGINS: '["http://localhost", "http://localhost:3000", "http://127.0.0.1", "http://${DOMAIN:-localhost}"]'
      FRONTEND_URL: http://${DOMAIN:-localhost}
      SHOW_DEV_RESET_LINK: ${SHOW_DEV_RESET_LINK:-False}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: learnlens_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: learnlens_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
